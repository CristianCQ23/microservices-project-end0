version: "3.8"

services:
  shopping-app:
    container_name: c-shopping
    build: .
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      DB_URL: mongodb://shopping-db:27018/shopping
      APP_SECRET: dev-secret-change-me
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - shopping-db

  shopping-db:
    container_name: c-shopping-db
    image: mongo:7
    ports:
      - "27018:27017"  
    volumes:
      - shopping-data:/data/db

volumes:
  shopping-data:
